services:
  db:
    image: pgvector/pgvector:pg16
    container_name: stahltrace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stahltrace
      POSTGRES_PASSWORD: stahltrace
      POSTGRES_DB: stahltrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stahltrace -d stahltrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
